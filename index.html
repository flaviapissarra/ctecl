<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CTecL · Computational Linguistics & AI Research</title>
  <meta name="description" content="Research and development in NLP, Generative AI, and Computational Linguistics by Flávia P. Pissarra." />

  <link rel="stylesheet" href="assets/css/global.css" />
  <link rel="icon" type="image/webp" href="assets/img/logo-ctecl.webp" />
</head>
<body>

  <div class="content">
    <header>
      <span class="cli-prompt">
        <span class="path">flaviapp@ctecl</span>:~/ctecl$ 
        <span class="cursor"></span>
      </span>
      
      <div class="logo-container">
        <img src="assets/img/logo-ctecl.webp" alt="CTeCL Logo" loading="lazy" />
      </div>
      
      <h1>CTecL</h1>
      <p class="tagline">Computational Linguistics & AI Research Lab<br/>Bridging human language and machine intelligence.</p>
      
      <div class="search-container">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search projects by name, tech stack, or description..." 
          aria-label="Search projects"
        />
      </div>
    </header>

    <main>
      <div class="section-header">
        <h2 class="section-title">Featured Projects</h2>
        <span id="projectCount" class="project-count">Loading...</span>
      </div>
      
      <div id="projectsGrid" class="projects-grid">
        <!-- Projects injected dynamically via JavaScript -->
      </div>
    </main>

    <footer>
      <a href="https://www.instagram.com/ctecl" target="_blank" rel="noopener noreferrer" class="social-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        Follow CTeCL on Instagram
      </a>

      <!-- Botão de acionamento -->
      <section style="text-align: center; margin: 4rem 0;">
        <button id="openContactModal" class="btn btn-primary">Send a Message →</button>
      </section>
      
      <!-- Modal Overlay -->
      <div id="contactModal" class="modal-overlay">
        <div class="modal-content">
          <button class="modal-close" aria-label="Close">&times;</button>
          
          <span class="cli-prompt" style="margin-bottom: 1.5rem;">
            <span class="path">flavia@ctecl</span>:~/contact$ <span class="cursor"></span>
          </span>
      
          <!-- Formulário Nativo -->
          <form id="contactForm" class="contact-form">
            <!-- Access Key da Web3Forms (Substitua pela sua) -->
            <input type="hidden" name="access_key" value="SUA_ACCESS_KEY_AQUI">
            
            <!-- Honeypot (Isca para bots - mantenha invisível) -->
            <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
      
            <input type="text" name="name" placeholder="Your name" required />
            <input type="email" name="email" placeholder="Your email" required />
            <select name="type" required>
              <option value="" disabled selected>Select contact type...</option>
              <option value="contribution">Technical Contribution</option>
              <option value="idea">Project Idea</option>
              <option value="partnership">Partnership</option>
              <option value="other">Other</option>
            </select>
            <textarea name="message" placeholder="Your message..." required></textarea>
            
            <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%;">
              Execute Send →
            </button>
          </form>
      
          <!-- Mensagem de Sucesso -->
          <div id="successMessage" class="success-message" style="display: none;">
            <p style="font-size: 1.2rem; margin-bottom: 0.5rem;">> Message sent successfully!</p>
            <span style="font-size: 0.85rem; color: var(--text-secondary);">Refreshing terminal...</span>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script src="assets/js/projects-loader.js" defer></script>
  <script src="assets/js/contact.js" defer></script>
</body>
</html>
