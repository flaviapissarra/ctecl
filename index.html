<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CTeCL · Computational Linguistics & AI Research</title>
  <meta name="description" content="Research and development in NLP, Generative AI, and Computational Linguistics by Flávia P. Pissarra." />

  <link rel="stylesheet" href="assets/css/global.css" />
  <link rel="icon" type="image/webp" href="assets/img/logo-ctecl.webp" />
</head>
<body>

  <div class="content">
    <header>
      <span class="cli-prompt">
        <span class="path">flaviap@ctecl</span>:~/ctecl$
        <span class="cursor"></span>
      </span>

      <div class="logo-container">
        <img src="assets/img/logo-ctecl.webp" alt="CTeCL Logo" loading="lazy" />
      </div>

      <h1>CTeCL</h1>
      <p class="tagline">Computational Linguistics &amp; AI Research Lab<br/>Bridging human language and machine intelligence.</p>

      <div class="search-container">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search projects by name, tech stack, or description..."
          aria-label="Search projects"
        />
      </div>
    </header>

    <main>
      <div class="section-header">
        <h2 class="section-title">Featured Projects</h2>
        <span id="projectCount" class="project-count">Loading...</span>
      </div>

      <div id="projectsGrid" class="projects-grid">
        <!-- Projects injected dynamically via JavaScript -->
      </div>
    </main>

    <div class="contact-section">
      <button id="openContactModal" class="contact-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        Send a Message →
      </button>
    </div>

    <footer>
      <a href="https://www.instagram.com/ctecl" target="_blank" rel="noopener noreferrer" class="social-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
        Follow CTeCL on Instagram
      </a>
    </footer>
  </div>

  <!-- Modal de Contato (fora do fluxo principal, no final do body) -->
  <div id="contactModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-labelledby="modalTitle">
      <button class="modal-close" aria-label="Close modal">&times;</button>

      <span class="cli-prompt">
        <span class="path">flavia@ctecl</span>:~/contact$
        <span class="cursor"></span>
      </span>

      <form id="contactForm" class="contact-form">
        <input type="hidden" name="access_key" value="13a03c98-bbec-40ac-ae5d-2c13cca82fbc">
        <input type="hidden" name="subject" value="New message from CTeCL portfolio">
        <input type="checkbox" name="botcheck" class="hidden" tabindex="-1" aria-hidden="true">

        <input type="text" name="name" placeholder="Your name" required />
        <input type="email" name="email" placeholder="Your email" required />

        <select name="type" required>
          <option value="" disabled selected>Select contact type...</option>
          <option value="contribution">Technical Contribution</option>
          <option value="idea">Project Idea</option>
          <option value="partnership">Partnership</option>
          <option value="other">Other</option>
        </select>

        <textarea name="message" placeholder="Your message..." required></textarea>

        <button type="submit" id="submitBtn">Execute Send →</button>
      </form>

      <div id="successMessage" class="success-message" hidden>
        <p>&gt; Message sent successfully!</p>
        <span>Refreshing terminal...</span>
      </div>
    </div>
  </div>

  <script src="assets/js/projects-loader.js" defer></script>
  <script src="assets/js/contact.js" defer></script>
</body>
</html>
